version: 1

# Dogfood config - testing go-actions with itself
ci:
  go:
    version-file: "cli/go.mod"

  test:
    enabled: true
    args: "-v -race ./..."
    coverage:
      enabled: false  # Disabled until CLI has more test coverage

  lint:
    enabled: true
    version: "auto"

  benchmark:
    enabled: false

  security:
    enabled: true
    version: "latest"
    fail-on: "high"

release:
  strategy: "release-please"

output:
  format: "auto"
  verbosity: "normal"
