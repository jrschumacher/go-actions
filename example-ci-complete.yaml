# Complete CI workflow with go-actions
# Copy this to .github/workflows/ci.yaml in your Go project

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Required for PR comments
permissions:
  contents: read
  pull-requests: write

jobs:
  # Step 1: Validate go-actions configuration
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: jrschumacher/go-actions/self-validate@v3

  # Step 2: Run CI jobs (only if validation passes)
  test:
    name: Tests
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: test

  lint:
    name: Lint
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: lint
          golangci-lint-version: v2.1.0  # Use v2.1.0 for best compatibility

  benchmark:
    name: Benchmarks
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # Only run on main branch pushes
    steps:
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: benchmark
          benchmark-count: 3  # Number of benchmark runs

# This workflow will:
# 1. Validate your go-actions configuration
# 2. Run tests with coverage reporting
# 3. Run linting with golangci-lint
# 4. Run benchmarks (on main branch only)
#
# Each CI job automatically posts and merges its results
# into a single unified PR comment.
