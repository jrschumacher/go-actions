version: 2

run:
  timeout: 5m
  tests: true
  # CI/CD: Prevent scanning cached dependencies and generated files
  skip-dirs:
    - vendor
    - node_modules
    - .git
  skip-files:
    - '*.pb.go'
    - '*_generated.go'

linters:  # ← Single linters block with all config nested inside
  enable:
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - govet
    - gofmt
    - goimports
    - ineffassign
    - misspell
    - gocritic
    - revive
    - stylecheck

  # v2 schema: linter-specific settings (nested under linters:)
  settings:
    govet:
      check-shadowing: true
    misspell:
      locale: US
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style

  # v2 schema: exclusion rules (nested under linters:, replaces issues.exclude-rules)
  exclusions:
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # Allow complexity in main function for example purposes
      - path: main\.go
        text: "cognitive complexity"
        linters:
          - gocognit

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
