name: 'Go CI Actions'
description: 'CI workflows for Go projects - test, lint, benchmark, and security'
author: 'Ryan Schumacher'

inputs:
  job:
    description: 'Job type to run: test, lint, benchmark, or security'
    required: true
  go-version:
    description: 'Go version to use (all jobs). Defaults to version from go.mod'
    required: false
    default: ''
  go-version-file:
    description: 'Path to file containing Go version (all jobs). Defaults to go.mod'
    required: false
    default: 'go.mod'
  working-directory:
    description: 'Working directory (all jobs)'
    required: false
    default: '.'
  
  # Test job specific inputs
  test-args:
    description: 'Additional arguments for go test (test job only)'
    required: false
    default: '-v -race -coverprofile=coverage.out'
  
  # Lint job specific inputs
  golangci-lint-version:
    description: 'golangci-lint version (lint job only). Use v2.0.2+ or v2/latest (auto-converted to v2.0.2)'
    required: false
    default: 'v2.0.2'
  lint-args:
    description: 'Additional arguments for golangci-lint (lint job only)'
    required: false
    default: ''
  
  # Benchmark job specific inputs
  benchmark-args:
    description: 'Additional arguments for go test -bench (benchmark job only)'
    required: false
    default: '-bench=. -benchmem'
  benchmark-count:
    description: 'Number of benchmark runs (benchmark job only)'
    required: false
    default: '5'

  # Security job specific inputs
  govulncheck-version:
    description: 'govulncheck version (security job only). Use "latest" for newest version'
    required: false
    default: 'latest'
  security-args:
    description: 'Additional arguments for govulncheck (security job only)'
    required: false
    default: ''

outputs:
  coverage:
    description: "Test coverage percentage"
    value: ${{ steps.coverage.outputs.coverage }}
  vulnerabilities:
    description: "Number of vulnerabilities found (security job only)"
    value: ${{ steps.security.outputs.vulnerabilities }}

runs:
  using: "composite"
  steps:
    - name: Validate job input
      shell: bash
      run: |
        valid_jobs="test lint benchmark security"
        job="${{ inputs.job }}"
        if [[ ! " $valid_jobs " =~ " $job " ]]; then
          echo "::error::Invalid job type: $job. Valid options are: $valid_jobs"
          exit 1
        fi

    # Note: Users should checkout their repository before calling this action
    # This action expects the repository to already be checked out

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ !inputs.go-version && inputs.go-version-file || '' }}

    # Test job
    - name: Run tests
      if: inputs.job == 'test'
      id: test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Running Go tests..."
        go test ${{ inputs.test-args }} ./...

    - name: Extract coverage and store results
      if: inputs.job == 'test'
      id: coverage
      uses: actions/github-script@v7
      with:
        script: |
          const { extractCoverage, UnifiedPRComment, updateUnifiedComment } = require('${{ github.action_path }}/../scripts-dist/ci-action-bundle/index.js');
          const workingDir = '${{ inputs.working-directory }}' || '.';
          
          const result = extractCoverage(workingDir);
          
          if (result.hasCoverage && result.coverage !== null) {
            console.log(`Coverage: ${result.coverage}%`);
            core.setOutput('coverage', result.coverage.toString());
          } else {
            console.log('No coverage data found');
            core.setOutput('coverage', '0');
          }
          
          // Store test results for unified comment
          const testResult = {
            status: '${{ steps.test.outcome }}' === 'success' ? 'success' : 'failure',
            coverage: result.hasCoverage && result.coverage !== null ? `${result.coverage}%` : undefined,
            error: '${{ steps.test.outcome }}' !== 'success' ? 'Test execution failed' : undefined
          };
          
          await UnifiedPRComment.storeResults('test', testResult);
          console.log('Stored test results for unified comment');

    # Benchmark job
    - name: Run benchmarks and store results
      if: inputs.job == 'benchmark'
      id: benchmark
      uses: actions/github-script@v7
      with:
        script: |
          const { runBenchmarks, UnifiedPRComment, updateUnifiedComment } = require('${{ github.action_path }}/../scripts-dist/ci-action-bundle/index.js');
          const workingDir = '${{ inputs.working-directory }}' || '.';
          const benchmarkArgs = '${{ inputs.benchmark-args }}' || '-bench=. -benchmem';
          const benchmarkCount = parseInt('${{ inputs.benchmark-count }}') || 5;
          
          try {
            const result = runBenchmarks(workingDir, benchmarkArgs, benchmarkCount);
            console.log('Benchmark results:', result);
            
            // Store benchmark results for unified comment
            const benchmarkResult = {
              status: 'success',
              config: {
                args: benchmarkArgs,
                count: benchmarkCount
              }
            };
            
            await UnifiedPRComment.storeResults('benchmark', benchmarkResult);
            
          } catch (error) {
            console.error('Benchmark failed:', error.message);
            
            // Store failure results
            const benchmarkResult = {
              status: 'failure',
              error: error.message,
              config: {
                args: benchmarkArgs,
                count: benchmarkCount
              }
            };
            
            await UnifiedPRComment.storeResults('benchmark', benchmarkResult);
            throw error; // Re-throw to fail the job
          }
          
          console.log('Stored benchmark results for unified comment');

    # Lint job
    - name: Normalize golangci-lint version
      if: inputs.job == 'lint'
      shell: bash
      id: normalize-version
      run: |
        version="${{ inputs.golangci-lint-version }}"
        # Convert generic v2/latest to a pinned version for reproducible installs
        if [ "$version" = "v2" ] || [ "$version" = "latest" ]; then
          version="v2.0.2"
        fi
        echo "normalized-version=$version" >> $GITHUB_OUTPUT
        echo "Using golangci-lint version: $version"

    - name: Install golangci-lint
      if: inputs.job == 'lint'
      shell: bash
      run: |
        version="${{ steps.normalize-version.outputs.normalized-version }}"
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin $version
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Validate golangci-lint installation
      if: inputs.job == 'lint'
      shell: bash
      run: |
        if ! command -v golangci-lint &> /dev/null; then
          echo "::error::golangci-lint installation failed - binary not found in PATH"
          exit 1
        fi
        echo "✅ golangci-lint installation verified"
        golangci-lint version

    - name: Run golangci-lint
      if: inputs.job == 'lint'
      id: golangci-lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        set +e  # Don't exit on error, we want to handle it ourselves

        # Run golangci-lint with both JSON and text output (v2 config approach)
        # Create a temporary config to enable multiple outputs
        cat > /tmp/golangci-lint-output.yml << 'EOF'
        version: "2"
        output:
          formats:
            json:
              path: golangci-lint-report.json
            text:
              path: stdout
              colors: true
        EOF

        # Run golangci-lint with the output config
        golangci-lint run ${{ inputs.lint-args }} --config=/tmp/golangci-lint-output.yml
        lint_exit_code=$?

        # Determine if there are actual linting issues vs other errors
        issues_found=0
        if [ -f golangci-lint-report.json ] && [ -s golangci-lint-report.json ]; then
          # Check if JSON has actual issues
          if grep -Eq '"Issues"[[:space:]]*:[[:space:]]*\[' golangci-lint-report.json; then
            issues_found=1
          fi
        fi

        # Set output based on whether we found issues
        if [ "$issues_found" -eq 1 ]; then
          echo "exit-code=1" >> $GITHUB_OUTPUT
          exit 1
        elif [ "$lint_exit_code" -ne 0 ]; then
          # golangci-lint failed for some other reason (config error, etc)
          echo "exit-code=1" >> $GITHUB_OUTPUT
          exit 1
        else
          echo "exit-code=0" >> $GITHUB_OUTPUT
          exit 0
        fi

    - name: Store lint results
      if: inputs.job == 'lint' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const { UnifiedPRComment, formatLintOutputForPR, getWorkflowLogsUrl } = require('${{ github.action_path }}/../scripts-dist/ci-action-bundle/index.js');
          const path = require('path');
          const workingDir = '${{ inputs.working-directory }}' || '.';

          // Check lint outcome
          const lintExitCode = '${{ steps.golangci-lint.outputs.exit-code }}';
          const lintOutcome = '${{ steps.golangci-lint.outcome }}';
          const hasIssues = lintExitCode === '1' || lintOutcome === 'failure';

          let lintResult = {
            status: hasIssues ? 'failure' : 'success'
          };

          if (hasIssues) {
            // Parse and format lint output for PR comment
            const jsonFilePath = path.join(workingDir, 'golangci-lint-report.json');
            const workflowLogsUrl = getWorkflowLogsUrl();

            const formattedIssues = formatLintOutputForPR(jsonFilePath, {
              maxIssuesPerLinter: 10,
              maxTotalIssues: 50,
              workflowLogsUrl
            });

            if (formattedIssues) {
              lintResult.issues = formattedIssues;
            } else {
              lintResult.error = 'Linting issues found - check logs for details';
            }
          }

          await UnifiedPRComment.storeResults('lint', lintResult);
          console.log('Stored lint results for unified comment');

    - name: Fail lint job on issues
      if: inputs.job == 'lint' && steps.golangci-lint.outputs.exit-code == '1'
      shell: bash
      run: exit 1

    # Security job
    - name: Install govulncheck
      if: inputs.job == 'security'
      shell: bash
      run: |
        echo "Installing govulncheck..."
        go install golang.org/x/vuln/cmd/govulncheck@${{ inputs.govulncheck-version }}
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Validate govulncheck installation
      if: inputs.job == 'security'
      shell: bash
      run: |
        if ! command -v govulncheck &> /dev/null; then
          echo "::error::govulncheck installation failed - binary not found in PATH"
          exit 1
        fi
        echo "✅ govulncheck installation verified"
        govulncheck -version || echo "Version command not available"

    - name: Run govulncheck
      if: inputs.job == 'security'
      id: govulncheck
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        set +e  # Don't exit on error, we want to capture the output

        echo "Running govulncheck..."

        # Run govulncheck with JSON output for parsing
        govulncheck -json ${{ inputs.security-args }} ./... > govulncheck-report.json 2>&1
        vuln_exit_code=$?

        # Also run with text output for logs
        govulncheck ${{ inputs.security-args }} ./... 2>&1 | tee govulncheck-output.txt

        # Check if vulnerabilities were found (exit code 3 = vulns found, 0 = none)
        if [ "$vuln_exit_code" -eq 3 ]; then
          echo "exit-code=3" >> $GITHUB_OUTPUT
          echo "vulnerabilities-found=true" >> $GITHUB_OUTPUT
          exit 1
        elif [ "$vuln_exit_code" -ne 0 ]; then
          echo "exit-code=$vuln_exit_code" >> $GITHUB_OUTPUT
          echo "vulnerabilities-found=false" >> $GITHUB_OUTPUT
          exit 1
        else
          echo "exit-code=0" >> $GITHUB_OUTPUT
          echo "vulnerabilities-found=false" >> $GITHUB_OUTPUT
          exit 0
        fi

    - name: Store security results
      if: inputs.job == 'security' && always()
      id: security
      uses: actions/github-script@v7
      with:
        script: |
          const { UnifiedPRComment, formatSecurityOutputForPR, getWorkflowLogsUrl } = require('${{ github.action_path }}/../scripts-dist/ci-action-bundle/index.js');
          const path = require('path');
          const workingDir = '${{ inputs.working-directory }}' || '.';

          // Check security outcome
          const vulnExitCode = '${{ steps.govulncheck.outputs.exit-code }}';
          const vulnsFound = '${{ steps.govulncheck.outputs.vulnerabilities-found }}' === 'true';
          const vulnOutcome = '${{ steps.govulncheck.outcome }}';
          const hasIssues = vulnsFound || vulnOutcome === 'failure';

          let securityResult = {
            status: hasIssues ? 'failure' : 'success',
            vulnerabilityCount: 0
          };

          if (hasIssues) {
            // Parse and format security output for PR comment
            const jsonFilePath = path.join(workingDir, 'govulncheck-report.json');
            const textFilePath = path.join(workingDir, 'govulncheck-output.txt');
            const workflowLogsUrl = getWorkflowLogsUrl();

            const formattedIssues = formatSecurityOutputForPR(jsonFilePath, textFilePath, {
              maxVulnerabilities: 20,
              workflowLogsUrl
            });

            if (formattedIssues) {
              securityResult.issues = formattedIssues.markdown;
              securityResult.vulnerabilityCount = formattedIssues.count;
            } else {
              securityResult.error = 'Vulnerabilities found - check logs for details';
            }
          }

          core.setOutput('vulnerabilities', securityResult.vulnerabilityCount.toString());
          await UnifiedPRComment.storeResults('security', securityResult);
          console.log('Stored security results for unified comment');

    - name: Fail security job on vulnerabilities
      if: inputs.job == 'security' && steps.govulncheck.outputs.vulnerabilities-found == 'true'
      shell: bash
      run: |
        echo "::error::Vulnerabilities found in dependencies. See PR comment or logs for details."
        exit 1

    # Results are automatically stored and unified comment is updated by each job
    # All CI results (test, lint, benchmark, security) appear in a single "Go Actions Report" comment
