name: 'Go CI Actions'
description: 'CI workflows for Go projects - test, lint, benchmark, and security'
author: 'Ryan Schumacher'

inputs:
  job:
    description: 'Job type to run: test, lint, benchmark, or security'
    required: true
  go-version:
    description: 'Go version to use (all jobs). Defaults to version from go.mod'
    required: false
    default: ''
  go-version-file:
    description: 'Path to file containing Go version (all jobs). Defaults to go.mod'
    required: false
    default: 'go.mod'
  working-directory:
    description: 'Working directory (all jobs)'
    required: false
    default: '.'

  # Test job specific inputs
  test-args:
    description: 'Arguments for go test. Overrides .go-actions.yaml ci.test.args. Leave empty for defaults.'
    required: false
    default: ''

  # Lint job specific inputs
  golangci-lint-version:
    description: 'golangci-lint version: "auto" (stable matrix), "latest" (bleeding edge), or explicit like "v2.8.0"'
    required: false
    default: 'auto'
  lint-args:
    description: 'Arguments for golangci-lint. Overrides .go-actions.yaml ci.lint.args. Leave empty for defaults.'
    required: false
    default: ''

  # Benchmark job specific inputs
  benchmark-args:
    description: 'Arguments for go test -bench. Overrides .go-actions.yaml ci.benchmark.args. Leave empty for defaults.'
    required: false
    default: ''
  benchmark-count:
    description: 'Number of benchmark runs. Overrides .go-actions.yaml ci.benchmark.count. Leave empty for default (5).'
    required: false
    default: ''

  # Security job specific inputs
  govulncheck-version:
    description: 'govulncheck version (security job only). Use "latest" for newest version'
    required: false
    default: 'latest'
  security-args:
    description: 'Arguments for govulncheck. Overrides .go-actions.yaml ci.security.args. Leave empty for defaults.'
    required: false
    default: ''

  # GitHub comment options
  github-comment:
    description: 'Post results as PR comment. Each job merges its results into a single unified comment.'
    required: false
    default: 'true'

outputs:
  coverage:
    description: "Test coverage percentage"
    value: ${{ steps.run-check.outputs.coverage }}
  issues:
    description: "Number of lint issues found"
    value: ${{ steps.run-check.outputs.issues }}
  vulnerabilities:
    description: "Number of vulnerabilities found"
    value: ${{ steps.run-check.outputs.vulnerabilities }}
  status:
    description: "Check status: pass, fail, or error"
    value: ${{ steps.run-check.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Validate job input
      shell: bash
      run: |
        valid_jobs="test lint benchmark security"
        job="${{ inputs.job }}"
        if [[ ! " $valid_jobs " =~ " $job " ]]; then
          echo "::error::Invalid job type: $job. Valid options are: $valid_jobs"
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ !inputs.go-version && inputs.go-version-file || '' }}

    - name: Build go-actions CLI
      shell: bash
      run: |
        echo "Building go-actions CLI..."
        cd "${{ github.action_path }}/../cli"
        go build -o /tmp/go-actions .
        echo "✅ CLI built successfully"

    - name: Install golangci-lint
      if: inputs.job == 'lint'
      shell: bash
      run: |
        version="${{ inputs.golangci-lint-version }}"

        if [ "$version" = "auto" ] || [ "$version" = "v2" ]; then
          # Auto-detect compatible version based on Go version using stable matrix
          go_version=$(go version | awk '{print $3}' | sed 's/go//')
          go_minor=$(echo "$go_version" | cut -d. -f2)

          # Compatibility matrix: golangci-lint version by Go minor version
          # Go 1.25+ requires golangci-lint v2.4.0+ (v2.8.0 is latest stable)
          # Go 1.24 works with v2.3.x
          # Go 1.23 and earlier work with v2.1.x
          if [ "$go_minor" -ge "25" ]; then
            version="v2.8.0"
          elif [ "$go_minor" -ge "24" ]; then
            version="v2.3.1"
          else
            version="v2.1.0"
          fi
          echo "🔍 Auto-detected golangci-lint $version for Go $go_version (stable matrix)"
        elif [ "$version" = "latest" ]; then
          # Fetch the actual latest version from GitHub
          version=$(curl -sS https://api.github.com/repos/golangci/golangci-lint/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "⚠️ Failed to fetch latest version, falling back to v2.8.0"
            version="v2.8.0"
          else
            echo "🚀 Using latest golangci-lint $version (bleeding edge)"
          fi
        fi

        echo "Installing golangci-lint $version..."
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$version"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        golangci-lint version

    - name: Install govulncheck
      if: inputs.job == 'security'
      shell: bash
      run: |
        echo "Installing govulncheck..."
        go install golang.org/x/vuln/cmd/govulncheck@${{ inputs.govulncheck-version }}
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Run check
      id: run-check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GO_ACTIONS_TEST_ARGS: ${{ inputs.test-args }}
        GO_ACTIONS_LINT_ARGS: ${{ inputs.lint-args }}
        GO_ACTIONS_BENCHMARK_ARGS: ${{ inputs.benchmark-args }}
        GO_ACTIONS_BENCHMARK_COUNT: ${{ inputs.benchmark-count }}
        GO_ACTIONS_SECURITY_ARGS: ${{ inputs.security-args }}
      run: |
        set +e  # Don't exit on error, we'll handle it

        echo "Running ${{ inputs.job }} check..."

        # Build command with optional github-comment flag
        comment_flag=""
        if [ "${{ inputs.github-comment }}" = "true" ]; then
          comment_flag="--github-comment"
        fi

        /tmp/go-actions check ${{ inputs.job }} --format=json $comment_flag > /tmp/result.json 2>&1
        exit_code=$?

        echo "--- Raw output ---"
        cat /tmp/result.json
        echo "--- End output ---"

        # Parse JSON output using jq for reliable parsing
        if [ -f /tmp/result.json ] && command -v jq &> /dev/null && jq -e '.status' /tmp/result.json > /dev/null 2>&1; then
          status=$(jq -r '.status // "unknown"' /tmp/result.json)
          coverage=$(jq -r '.checks[0].coverage // 0' /tmp/result.json)
          issues=$(jq -r '.checks[0].issues // 0' /tmp/result.json)
          vulns=$(jq -r '.checks[0].vulnerabilities // 0' /tmp/result.json)
          message=$(jq -r '.checks[0].message // ""' /tmp/result.json)

          echo "status=${status}" >> $GITHUB_OUTPUT
          echo "coverage=${coverage}" >> $GITHUB_OUTPUT
          echo "issues=${issues}" >> $GITHUB_OUTPUT
          echo "vulnerabilities=${vulns}" >> $GITHUB_OUTPUT

          echo "📊 Results:"
          echo "  Status: ${status}"
          [ "$coverage" != "0" ] && [ "$coverage" != "null" ] && echo "  Coverage: ${coverage}%"
          [ "$issues" != "0" ] && [ "$issues" != "null" ] && echo "  Issues: ${issues}"
          [ "$vulns" != "0" ] && [ "$vulns" != "null" ] && echo "  Vulnerabilities: ${vulns}"
          [ -n "$message" ] && [ "$message" != "null" ] && echo "  Message: ${message}"

          # Display command output if present (e.g., test failure details)
          check_output=$(jq -r '.checks[0].output // ""' /tmp/result.json)
          if [ -n "$check_output" ] && [ "$check_output" != "null" ]; then
            echo ""
            echo "--- Command Output ---"
            echo "$check_output"
            echo "--- End Command Output ---"
          fi
        else
          echo "status=error" >> $GITHUB_OUTPUT
          echo "coverage=0" >> $GITHUB_OUTPUT
          echo "issues=0" >> $GITHUB_OUTPUT
          echo "vulnerabilities=0" >> $GITHUB_OUTPUT
          echo "::error::Failed to parse check results"
        fi

        # Exit with original code
        if [ "$exit_code" -ne 0 ]; then
          echo "::error::${{ inputs.job }} check failed"
          exit $exit_code
        fi

        echo "✅ ${{ inputs.job }} check passed"
