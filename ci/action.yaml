name: 'Go CI Actions'
description: 'CI workflows for Go projects - test, lint, benchmark, and security'
author: 'Ryan Schumacher'

inputs:
  job:
    description: 'Job type to run: test, lint, benchmark, or security'
    required: true
  go-version:
    description: 'Go version to use (all jobs). Defaults to version from go.mod'
    required: false
    default: ''
  go-version-file:
    description: 'Path to file containing Go version (all jobs). Defaults to go.mod'
    required: false
    default: 'go.mod'
  working-directory:
    description: 'Working directory (all jobs)'
    required: false
    default: '.'

  # Test job specific inputs
  test-args:
    description: 'Additional arguments for go test (test job only)'
    required: false
    default: '-v -race -coverprofile=coverage.out ./...'

  # Lint job specific inputs
  golangci-lint-version:
    description: 'golangci-lint version (lint job only). Use v2.0.2+ or v2/latest (auto-converted to v2.0.2)'
    required: false
    default: 'v2.0.2'
  lint-args:
    description: 'Additional arguments for golangci-lint (lint job only)'
    required: false
    default: ''

  # Benchmark job specific inputs
  benchmark-args:
    description: 'Additional arguments for go test -bench (benchmark job only)'
    required: false
    default: '-bench=. -benchmem'
  benchmark-count:
    description: 'Number of benchmark runs (benchmark job only)'
    required: false
    default: '5'

  # Security job specific inputs
  govulncheck-version:
    description: 'govulncheck version (security job only). Use "latest" for newest version'
    required: false
    default: 'latest'
  security-args:
    description: 'Additional arguments for govulncheck (security job only)'
    required: false
    default: ''

outputs:
  coverage:
    description: "Test coverage percentage"
    value: ${{ steps.run-check.outputs.coverage }}
  issues:
    description: "Number of lint issues found"
    value: ${{ steps.run-check.outputs.issues }}
  vulnerabilities:
    description: "Number of vulnerabilities found"
    value: ${{ steps.run-check.outputs.vulnerabilities }}
  status:
    description: "Check status: pass, fail, or error"
    value: ${{ steps.run-check.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Validate job input
      shell: bash
      run: |
        valid_jobs="test lint benchmark security"
        job="${{ inputs.job }}"
        if [[ ! " $valid_jobs " =~ " $job " ]]; then
          echo "::error::Invalid job type: $job. Valid options are: $valid_jobs"
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ !inputs.go-version && inputs.go-version-file || '' }}

    - name: Build go-actions CLI
      shell: bash
      run: |
        echo "Building go-actions CLI..."
        cd "${{ github.action_path }}/../cli"
        go build -o /tmp/go-actions .
        echo "✅ CLI built successfully"

    - name: Install golangci-lint
      if: inputs.job == 'lint'
      shell: bash
      run: |
        version="${{ inputs.golangci-lint-version }}"
        # Convert generic v2/latest to a pinned version
        if [ "$version" = "v2" ] || [ "$version" = "latest" ]; then
          version="v2.0.2"
        fi
        echo "Installing golangci-lint $version..."
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin $version
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        golangci-lint version

    - name: Install govulncheck
      if: inputs.job == 'security'
      shell: bash
      run: |
        echo "Installing govulncheck..."
        go install golang.org/x/vuln/cmd/govulncheck@${{ inputs.govulncheck-version }}
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Run check
      id: run-check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GO_ACTIONS_TEST_ARGS: ${{ inputs.test-args }}
        GO_ACTIONS_LINT_ARGS: ${{ inputs.lint-args }}
        GO_ACTIONS_BENCHMARK_ARGS: ${{ inputs.benchmark-args }}
        GO_ACTIONS_BENCHMARK_COUNT: ${{ inputs.benchmark-count }}
        GO_ACTIONS_SECURITY_ARGS: ${{ inputs.security-args }}
      run: |
        set +e  # Don't exit on error, we'll handle it

        echo "Running ${{ inputs.job }} check..."
        /tmp/go-actions check ${{ inputs.job }} --format=json > /tmp/result.json 2>&1
        exit_code=$?

        echo "--- Raw output ---"
        cat /tmp/result.json
        echo "--- End output ---"

        # Parse JSON output using jq for reliable parsing
        if [ -f /tmp/result.json ] && command -v jq &> /dev/null && jq -e '.status' /tmp/result.json > /dev/null 2>&1; then
          status=$(jq -r '.status // "unknown"' /tmp/result.json)
          coverage=$(jq -r '.checks[0].coverage // 0' /tmp/result.json)
          issues=$(jq -r '.checks[0].issues // 0' /tmp/result.json)
          vulns=$(jq -r '.checks[0].vulnerabilities // 0' /tmp/result.json)
          message=$(jq -r '.checks[0].message // ""' /tmp/result.json)

          echo "status=${status}" >> $GITHUB_OUTPUT
          echo "coverage=${coverage}" >> $GITHUB_OUTPUT
          echo "issues=${issues}" >> $GITHUB_OUTPUT
          echo "vulnerabilities=${vulns}" >> $GITHUB_OUTPUT

          echo "📊 Results:"
          echo "  Status: ${status}"
          [ "$coverage" != "0" ] && [ "$coverage" != "null" ] && echo "  Coverage: ${coverage}%"
          [ "$issues" != "0" ] && [ "$issues" != "null" ] && echo "  Issues: ${issues}"
          [ "$vulns" != "0" ] && [ "$vulns" != "null" ] && echo "  Vulnerabilities: ${vulns}"
          [ -n "$message" ] && [ "$message" != "null" ] && echo "  Message: ${message}"
        else
          echo "status=error" >> $GITHUB_OUTPUT
          echo "coverage=0" >> $GITHUB_OUTPUT
          echo "issues=0" >> $GITHUB_OUTPUT
          echo "vulnerabilities=0" >> $GITHUB_OUTPUT
          echo "::error::Failed to parse check results"
        fi

        # Exit with original code
        if [ "$exit_code" -ne 0 ]; then
          echo "::error::${{ inputs.job }} check failed"
          exit $exit_code
        fi

        echo "✅ ${{ inputs.job }} check passed"
