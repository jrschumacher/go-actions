name: 'Go CI Actions'
description: 'CI workflows for Go projects - test, lint, benchmark, and security'
author: 'Ryan Schumacher'

inputs:
  job:
    description: 'Job type to run: test, lint, benchmark, or security'
    required: true
  go-version:
    description: 'Go version to use (all jobs). Defaults to version from go.mod'
    required: false
    default: ''
  go-version-file:
    description: 'Path to file containing Go version (all jobs). Defaults to go.mod'
    required: false
    default: 'go.mod'
  working-directory:
    description: 'Working directory (all jobs)'
    required: false
    default: '.'

  # Test job specific inputs
  test-args:
    description: 'Arguments for go test. Overrides .go-actions.yaml ci.test.args. Leave empty for defaults.'
    required: false
    default: ''

  # Lint job specific inputs
  lint-args:
    description: 'Arguments for golangci-lint. Overrides .go-actions.yaml ci.lint.args. Leave empty for defaults.'
    required: false
    default: ''

  # Benchmark job specific inputs
  benchmark-args:
    description: 'Arguments for go test -bench. Overrides .go-actions.yaml ci.benchmark.args. Leave empty for defaults.'
    required: false
    default: ''
  benchmark-count:
    description: 'Number of benchmark runs. Overrides .go-actions.yaml ci.benchmark.count. Leave empty for default (5).'
    required: false
    default: ''

  # Security job specific inputs
  govulncheck-version:
    description: 'govulncheck version (security job only). Use "latest" for newest version'
    required: false
    default: 'latest'
  security-args:
    description: 'Arguments for govulncheck. Overrides .go-actions.yaml ci.security.args. Leave empty for defaults.'
    required: false
    default: ''

  # GitHub comment options
  github-comment:
    description: 'Post results as PR comment. Each job merges its results into a single unified comment.'
    required: false
    default: 'true'

outputs:
  coverage:
    description: "Test coverage percentage"
    value: ${{ steps.run-check.outputs.coverage }}
  issues:
    description: "Number of lint issues found"
    value: ${{ steps.run-check.outputs.issues }}
  vulnerabilities:
    description: "Number of vulnerabilities found"
    value: ${{ steps.run-check.outputs.vulnerabilities }}
  status:
    description: "Check status: pass, fail, or error"
    value: ${{ steps.run-check.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Validate job input
      shell: bash
      env:
        JOB: ${{ inputs.job }}
      run: |
        valid_jobs="test lint benchmark security"
        if [[ ! " $valid_jobs " =~ " $JOB " ]]; then
          echo "::error::Invalid job type: $JOB. Valid options are: $valid_jobs"
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ !inputs.go-version && inputs.go-version-file || '' }}

    - name: Install go-actions CLI
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -e

        bin_name="go-actions"
        if [ "$RUNNER_OS" = "Windows" ]; then
          bin_name="go-actions.exe"
        fi
        install_path="$RUNNER_TEMP/$bin_name"

        os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) arch="" ;;
        esac

        version_file="$ACTION_PATH/../VERSION"
        if [ -n "$arch" ] && [ -f "$version_file" ]; then
          version=$(tr -d '[:space:]' < "$version_file")
          ext="tar.gz"
          if [ "$os" = "windows" ]; then
            ext="zip"
          fi
          url="https://github.com/jrschumacher/go-actions/releases/download/go-actions-v${version}/go-actions_${version}_${os}_${arch}.${ext}"
          tmp=$(mktemp -d)
          echo "Downloading prebuilt go-actions v${version} (${os}/${arch}) from ${url}"

          install_prebuilt() {
            curl -sSfL "$url" -o "$tmp/archive.$ext" || return 1
            if [ "$ext" = "zip" ]; then
              unzip -q "$tmp/archive.$ext" -d "$tmp" || return 1
            else
              tar -xzf "$tmp/archive.$ext" -C "$tmp" || return 1
            fi
            mv "$tmp/$bin_name" "$install_path" || return 1
            chmod +x "$install_path" || return 1
          }

          if install_prebuilt; then
            echo "GO_ACTIONS_BIN=$install_path" >> "$GITHUB_ENV"
            echo "✅ Installed prebuilt go-actions v${version}"
            exit 0
          fi
          echo "⚠️  Prebuilt binary install failed; falling back to source build"
        else
          echo "ℹ️  No VERSION file or unsupported arch (${RUNNER_ARCH}); building from source"
        fi

        cd "$ACTION_PATH/../cli"
        go build -o "$install_path" ./cmd/go-actions
        echo "GO_ACTIONS_BIN=$install_path" >> "$GITHUB_ENV"
        echo "✅ Built go-actions from source"

    - name: Install golangci-lint
      if: inputs.job == 'lint'
      shell: bash
      run: |
        go_version=$(go version | awk '{print $3}' | sed 's/go//')
        go_minor=$(echo "$go_version" | cut -d. -f2)
        GOBIN="$(go env GOPATH)/bin"

        # Fetch the latest golangci-lint version from GitHub
        version=$(curl -sS https://api.github.com/repos/golangci/golangci-lint/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$version" ] || [ "$version" = "null" ]; then
          version="v2.11.4"
          echo "⚠️ Failed to fetch latest version, falling back to $version"
        fi
        echo "🔍 Using golangci-lint $version for Go $go_version"

        # Try prebuilt binary first (fast), fall back to source install if
        # the binary was built with an older Go than the project targets.
        echo "Installing golangci-lint $version..."
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$GOBIN" "$version"
        echo "$GOBIN" >> "$GITHUB_PATH"
        export PATH="$GOBIN:$PATH"

        # Check if the prebuilt binary's Go version is compatible
        # Output format: "golangci-lint has version X.Y.Z built with go1.NN.M ..."
        lint_go_minor=$(golangci-lint version 2>/dev/null | grep -o 'built with go[0-9.]*' | sed 's/built with go//' | cut -d. -f2)

        if [ -n "$lint_go_minor" ] && [ "$go_minor" -gt "$lint_go_minor" ]; then
          echo "⚠️ Prebuilt golangci-lint was built with older Go (minor $lint_go_minor) than project (minor $go_minor)"
          echo "📦 Rebuilding from source with current Go toolchain..."
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$version"
        fi

        golangci-lint version

    - name: Install govulncheck
      if: inputs.job == 'security'
      shell: bash
      env:
        GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
      run: |
        echo "Installing govulncheck..."
        go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Run check
      id: run-check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GO_ACTIONS_TEST_ARGS: ${{ inputs.test-args }}
        GO_ACTIONS_LINT_ARGS: ${{ inputs.lint-args }}
        GO_ACTIONS_BENCHMARK_ARGS: ${{ inputs.benchmark-args }}
        GO_ACTIONS_BENCHMARK_COUNT: ${{ inputs.benchmark-count }}
        GO_ACTIONS_SECURITY_ARGS: ${{ inputs.security-args }}
        JOB: ${{ inputs.job }}
        GITHUB_COMMENT: ${{ inputs.github-comment }}
      run: |
        set +e  # Don't exit on error, we'll handle it

        echo "Running $JOB check..."

        # Build command with optional github-comment flag
        comment_flag=""
        if [ "$GITHUB_COMMENT" = "true" ]; then
          comment_flag="--github-comment"
        fi

        "$GO_ACTIONS_BIN" check "$JOB" --format=json $comment_flag > /tmp/result.json 2>/tmp/result.stderr
        exit_code=$?

        # Show stderr warnings in logs (kept separate from JSON output)
        if [ -s /tmp/result.stderr ]; then
          echo "--- Stderr ---"
          cat /tmp/result.stderr
          echo "--- End stderr ---"
        fi

        echo "--- Raw output ---"
        cat /tmp/result.json
        echo "--- End output ---"

        # Parse JSON output using jq for reliable parsing
        if [ -f /tmp/result.json ] && command -v jq &> /dev/null && jq -e '.status' /tmp/result.json > /dev/null 2>&1; then
          status=$(jq -r '.status // "unknown"' /tmp/result.json)
          coverage=$(jq -r '.checks[0].coverage // 0' /tmp/result.json)
          issues=$(jq -r '.checks[0].issues // 0' /tmp/result.json)
          vulns=$(jq -r '.checks[0].vulnerabilities // 0' /tmp/result.json)
          message=$(jq -r '.checks[0].message // ""' /tmp/result.json)

          echo "status=${status}" >> $GITHUB_OUTPUT
          echo "coverage=${coverage}" >> $GITHUB_OUTPUT
          echo "issues=${issues}" >> $GITHUB_OUTPUT
          echo "vulnerabilities=${vulns}" >> $GITHUB_OUTPUT

          echo "📊 Results:"
          echo "  Status: ${status}"
          [ "$coverage" != "0" ] && [ "$coverage" != "null" ] && echo "  Coverage: ${coverage}%"
          [ "$issues" != "0" ] && [ "$issues" != "null" ] && echo "  Issues: ${issues}"
          [ "$vulns" != "0" ] && [ "$vulns" != "null" ] && echo "  Vulnerabilities: ${vulns}"
          [ -n "$message" ] && [ "$message" != "null" ] && echo "  Message: ${message}"

          # Display command output if present (e.g., test failure details)
          check_output=$(jq -r '.checks[0].output // ""' /tmp/result.json)
          if [ -n "$check_output" ] && [ "$check_output" != "null" ]; then
            echo ""
            echo "--- Command Output ---"
            echo "$check_output"
            echo "--- End Command Output ---"
          fi
        else
          echo "status=error" >> $GITHUB_OUTPUT
          echo "coverage=0" >> $GITHUB_OUTPUT
          echo "issues=0" >> $GITHUB_OUTPUT
          echo "vulnerabilities=0" >> $GITHUB_OUTPUT
          echo "::error::Failed to parse check results"
        fi

        # Exit with original code
        if [ "$exit_code" -ne 0 ]; then
          echo "::error::$JOB check failed"
          exit $exit_code
        fi

        echo "✅ $JOB check passed"
