# Minimal CI workflow with go-actions
# Copy this to .github/workflows/ci.yaml for basic Go projects

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Required for PR comments
permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: jrschumacher/go-actions/self-validate@v3

  test:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: test

  lint:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: lint
