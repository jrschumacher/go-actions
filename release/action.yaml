name: 'Go Release Actions'
description: 'Release workflows for Go projects using Release Please and GoReleaser'
author: 'Ryan Schumacher'

inputs:
  go-version:
    description: 'Go version to use. Defaults to version from go.mod'
    required: false
    default: ''
  go-version-file:
    description: 'Path to file containing Go version. Defaults to go.mod'
    required: false
    default: 'go.mod'
  working-directory:
    description: 'Working directory'
    required: false
    default: '.'
  release-token:
    description: 'Personal Access Token (PAT) for Release Please. Required for creating PRs. Must be passed as a secret (e.g., secrets.RELEASE_PAT)'
    required: true
  config-file:
    description: 'Path to release-please config file. Defaults to release-please-config.json'
    required: false
    default: 'release-please-config.json'
  manifest-file:
    description: 'Path to release-please manifest file. Defaults to .release-please-manifest.json'
    required: false
    default: '.release-please-manifest.json'
  skip-github-release:
    description: 'If true, compute release state without creating a GitHub release.'
    required: false
    default: 'false'
  skip-github-pull-request:
    description: 'If true, compute release state without creating or updating release PRs.'
    required: false
    default: 'false'
  create-version-aliases:
    description: 'Create major/minor version aliases (e.g., v1 -> v1.2.3, v1.2 -> v1.2.3). Defaults to false for reproducible builds.'
    required: false
    default: 'false'
  goreleaser-args:
    description: 'GoReleaser arguments. Overrides .go-actions.yaml release.goreleaser.args. Defaults to "release --clean".'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ !inputs.go-version && inputs.go-version-file || '' }}

    - name: Build go-actions CLI
      shell: bash
      run: |
        echo "Building go-actions CLI..."
        cd "${{ github.action_path }}/../cli"
        go build -o /tmp/go-actions ./cmd/go-actions
        echo "CLI built successfully"

    - name: Read release config
      id: config
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Determine goreleaser args: action input > config file > default
        goreleaser_args="release --clean"

        if [ -n "${{ inputs.goreleaser-args }}" ]; then
          goreleaser_args="${{ inputs.goreleaser-args }}"
          echo "Using goreleaser args from action input: $goreleaser_args"
        elif [ -f ".go-actions.yaml" ]; then
          config_args=$(/tmp/go-actions config get release.goreleaser.args 2>/dev/null || echo "")
          if [ -n "$config_args" ]; then
            goreleaser_args="$config_args"
            echo "Using goreleaser args from .go-actions.yaml: $goreleaser_args"
          fi
        fi

        echo "goreleaser-args=$goreleaser_args" >> $GITHUB_OUTPUT

    - name: Run Release Please
      uses: googleapis/release-please-action@v4.2.0
      id: release
      with:
        token: ${{ inputs.release-token }}
        release-type: go
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}
        skip-github-release: ${{ inputs.skip-github-release }}
        skip-github-pull-request: ${{ inputs.skip-github-pull-request }}
        
    - name: Check Release Please outputs
      shell: bash
      run: |
        echo "Release created: '${{ steps.release.outputs.release_created }}'"
        echo "Tag name: '${{ steps.release.outputs.tag_name }}'"
        echo "Version: '${{ steps.release.outputs.version }}'"
        if [ "${{ steps.release.outputs.release_created }}" = "true" ]; then
          echo "✅ Release was created, proceeding with GoReleaser"
        else
          echo "ℹ️  No release was created, skipping GoReleaser"
        fi
        
    - name: Run GoReleaser
      if: steps.release.outputs.release_created == 'true'
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: latest
        args: ${{ steps.config.outputs.goreleaser-args }}
      env:
        GITHUB_TOKEN: ${{ inputs.release-token || github.token }}
        
    - name: Create version aliases for Go modules
      if: steps.release.outputs.release_created == 'true' && inputs.create-version-aliases == 'true'
      shell: bash
      run: |
        VERSION="${{ steps.release.outputs.version }}"
        TAG_NAME="${{ steps.release.outputs.tag_name }}"
        
        echo "Creating version aliases for version: $VERSION"
        echo "Tag name: $TAG_NAME"
        
        # Extract major and minor versions
        if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          
          echo "Major: $MAJOR, Minor: $MINOR, Patch: $PATCH"
          
          # Create major version alias (v1 -> v1.2.3)
          git tag -f "v$MAJOR" "$TAG_NAME"
          echo "Created/updated tag: v$MAJOR -> $TAG_NAME"
          
          # Create minor version alias (v1.2 -> v1.2.3)
          git tag -f "v$MAJOR.$MINOR" "$TAG_NAME"
          echo "Created/updated tag: v$MAJOR.$MINOR -> $TAG_NAME"
          
          # Push the new tags
          git push origin --tags --force
          echo "Pushed version alias tags to remote"
        else
          echo "Version format not recognized: $VERSION"
          exit 1
        fi
