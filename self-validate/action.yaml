name: 'Go Actions Self-Validator'
description: 'Validates project configuration when go-actions are used in workflows'
author: 'Ryan Schumacher'

inputs:
  workflow-paths:
    description: 'Comma-separated list of workflow files to check (e.g., .github/workflows/ci.yaml,.github/workflows/release.yaml)'
    required: false
    default: '.github/workflows/*.yaml,.github/workflows/*.yml'
  comment-on-pr:
    description: 'Whether to comment on PR with validation results'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    # Note: The calling workflow must check out the repository before using this action.
    # We don't do checkout here to avoid overwriting files created by the calling workflow.

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: '${{ github.action_path }}/../cli/go.mod'
        cache: false

    - name: Build CLI
      shell: bash
      run: |
        cd "${{ github.action_path }}/../cli"
        go build -o /tmp/go-actions-validator .
        echo "✅ CLI built successfully"

    - name: Run validation
      id: validate
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        # Run the pre-built Go CLI validator (avoids go download messages in output)
        if output=$(/tmp/go-actions-validator validate --format json --quiet 2>&1); then
          echo "validation_passed=true" >> $GITHUB_OUTPUT
          echo "result=$output" >> $GITHUB_OUTPUT
        else
          echo "validation_passed=false" >> $GITHUB_OUTPUT
          echo "result=$output" >> $GITHUB_OUTPUT
        fi

        # Always output the JSON for downstream processing
        echo "$output"

    - name: Store results for unified comment
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        VALIDATION_RESULT: ${{ steps.validate.outputs.result }}
        VALIDATION_PASSED: ${{ steps.validate.outputs.validation_passed }}
      with:
        script: |
          const { storeJobResults, setProcessingState } = require('${{ github.action_path }}/../scripts-dist/unified-comment-bundle/index.js');

          // Parse validation result
          let result;
          try {
            result = JSON.parse(process.env.VALIDATION_RESULT || '{}');
          } catch (e) {
            result = { valid: false, errors: ['Failed to parse validation result'], warnings: [] };
          }

          // Store results for unified comment
          await storeJobResults('selfValidate', {
            status: result.valid ? 'success' : 'failure',
            actionsFound: [],
            errors: (result.errors || []).map(msg => ({
              type: 'validation_error',
              message: msg,
              severity: 'error'
            }))
          });

    - name: Fail if validation failed
      if: steps.validate.outputs.validation_passed == 'false'
      shell: bash
      run: |
        echo "::error::Validation failed"
        exit 1
