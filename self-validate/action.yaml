name: 'Go Actions Self-Validator'
description: 'Validates project configuration when go-actions are used in workflows'
author: 'Ryan Schumacher'

inputs:
  workflow-paths:
    description: 'Comma-separated list of workflow files to check (e.g., .github/workflows/ci.yaml,.github/workflows/release.yaml)'
    required: false
    default: '.github/workflows/*.yaml,.github/workflows/*.yml'
  comment-on-pr:
    description: 'Whether to comment on PR with validation results'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    # Note: The calling workflow must check out the repository before using this action.
    # We don't do checkout here to avoid overwriting files created by the calling workflow.

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: '${{ github.action_path }}/../cli/go.mod'
        cache: false

    - name: Build CLI
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH/../cli"
        go build -o /tmp/go-actions-validator ./cmd/go-actions
        echo "✅ CLI built successfully"

    - name: Run validation
      id: validate
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        # Run the pre-built Go CLI validator (avoids go download messages in output)
        if output=$(/tmp/go-actions-validator validate --format json --quiet 2>/tmp/validate.stderr); then
          echo "validation_passed=true" >> $GITHUB_OUTPUT
          echo "result=$output" >> $GITHUB_OUTPUT
        else
          echo "validation_passed=false" >> $GITHUB_OUTPUT
          echo "result=$output" >> $GITHUB_OUTPUT
        fi

        # Show stderr warnings in logs
        if [ -s /tmp/validate.stderr ]; then
          cat /tmp/validate.stderr >&2
        fi

        # Always output the JSON for downstream processing
        echo "$output"

    - name: Fail if validation failed
      if: steps.validate.outputs.validation_passed == 'false'
      shell: bash
      run: |
        echo "::error::Validation failed"
        exit 1
