name: 'Go Actions Comment'
description: 'Post unified CI results as a PR comment'
author: 'Ryan Schumacher'

inputs:
  go-version:
    description: 'Go version to use. Defaults to version from go.mod'
    required: false
    default: ''
  go-version-file:
    description: 'Path to file containing Go version. Defaults to go.mod'
    required: false
    default: 'go.mod'
  test-status:
    description: 'Test job result (success, failure, cancelled, skipped)'
    required: false
    default: 'skip'
  test-coverage:
    description: 'Test coverage percentage'
    required: false
    default: '0'
  lint-status:
    description: 'Lint job result (success, failure, cancelled, skipped)'
    required: false
    default: 'skip'
  lint-issues:
    description: 'Number of lint issues found'
    required: false
    default: '0'
  security-status:
    description: 'Security job result (success, failure, cancelled, skipped)'
    required: false
    default: 'skip'
  security-vulnerabilities:
    description: 'Number of vulnerabilities found'
    required: false
    default: '0'
  benchmark-status:
    description: 'Benchmark job result (success, failure, cancelled, skipped)'
    required: false
    default: 'skip'

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ !inputs.go-version && inputs.go-version-file || '' }}

    - name: Build go-actions CLI
      shell: bash
      run: |
        echo "Building go-actions CLI..."
        cd "${{ github.action_path }}/../cli"
        go build -o /tmp/go-actions .
        echo "CLI built successfully"

    - name: Post PR comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GO_ACTIONS_TEST_STATUS: ${{ inputs.test-status }}
        GO_ACTIONS_TEST_COVERAGE: ${{ inputs.test-coverage }}
        GO_ACTIONS_LINT_STATUS: ${{ inputs.lint-status }}
        GO_ACTIONS_LINT_ISSUES: ${{ inputs.lint-issues }}
        GO_ACTIONS_SECURITY_STATUS: ${{ inputs.security-status }}
        GO_ACTIONS_SECURITY_VULNS: ${{ inputs.security-vulnerabilities }}
        GO_ACTIONS_BENCHMARK_STATUS: ${{ inputs.benchmark-status }}
      run: /tmp/go-actions comment
