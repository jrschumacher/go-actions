version: 2

run:
  timeout: 5m
  # CI/CD: Prevent scanning cached dependencies and generated files
  skip-dirs:
    - vendor
    - node_modules
    - .git
  skip-files:
    - '*.pb.go'
    - '*_generated.go'

linters:
  enable:
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - govet
